services:
  kopyparty:
    build: .
    container_name: kopyparty
    restart: unless-stopped
    ports:
      - "${KOPYPARTY_PORT:-8282}:3923"
    volumes:
      - ${KOPYPARTY_DATA_DIR:-./srv}:/data:ro
      # /cache holds the thumbnail cache (.hist tree) and the up2k index DB.
      # Source is mounted read-only, so kopyparty would otherwise fail to
      # write thumbs into each volume's default `.hist` folder. --hist points
      # the histpath to this writable named volume instead.
      #
      # PERF: this volume MUST live on fast storage (SSD), NOT the USB HDD,
      # or metadata/thumbnail reads keep seeking. Named volumes live under the
      # docker data-root. Verify the backing device with:
      #   docker volume inspect kopyparty_cache --format '{{.Mountpoint}}'
      #   df --output=source <that path>      # then confirm it's your SSD
      # To pin it to an explicit SSD path instead, replace the line below with
      # a bind mount, e.g.:  - /mnt/ssd/kopyparty-cache:/cache
      - kopyparty_cache:/cache
    # PERF: this cgroup cap also bounds the kernel page-cache for file reads
    # served off the USB HDD (reclaimable). With rarely-changing content, a
    # generous limit keeps recently-downloaded files hot in RAM. Set to
    # ~60-75% of host RAM. The in-memory directory cache (KOPYPARTY_DIRCACHE_SECS)
    # is tiny and counts here too but is negligible.
    mem_limit: ${KOPYPARTY_MEM_LIMIT:-8g}
    memswap_limit: ${KOPYPARTY_MEM_LIMIT:-8g}
    environment:
      - TZ=${TZ:-UTC}
    command:
      - --no-crt
      - --grid
      # KD fork: read-only archive — no folder/multi-file ZIP/TAR downloads.
      # Blocks the ?zip/?tar route (tx_zip raises) AND hides the client UI
      # (have_zip := not no_zip). Only single files download.
      - --no-zip
      - --kd-header=${KOPYPARTY_HEADER:-KD's Homebrew Data Archive}
      - --kd-footer=${KOPYPARTY_FOOTER:-Served offline via KD's Homebrew Data Archive}
      # ----- thumbnails: pregen at startup, never expire, never on-demand -----
      # --hist redirects all per-volume databases + thumbnail caches into
      # /cache (so the read-only source mount stays intact).
      - --hist=/cache
      # -e2dsa scans every volume on startup, populating the file index
      # which --th-pregen then walks to generate thumbnails.
      - -e2dsa
      # --th-pregen formats: jpg/webp + cropped + 3x variants. The list
      # matches what the grid view requests via ?th=j / ?th=w&th3 etc.
      - --th-pregen=j,jf,w,w3,wf,wf3
      # ratelimit pregen log spam to one line every 5 seconds
      - --th-pre-rl=5
      # never expire / clean up the cache (rebuild image if you need to
      # rotate the thumbnail set explicitly).
      - --th-maxage=999999999
      - --th-clean=0
      # PERF: keep -j1. This is a DISK-bound, read-only archive — the USB HDD's
      # seek latency is the bottleneck, not CPU. -j1 runs a single process that
      # already serves requests concurrently via a thread pool AND shares one
      # warm in-memory directory cache. Raising -j spawns separate worker
      # PROCESSES that each maintain (and re-walk) their OWN copy of the cache,
      # multiplying the startup/daily tree scan across the slow disk and the
      # RAM used — worse here, not better. Only raise it if you become genuinely
      # CPU-bound (e.g. heavy concurrent thumbnail transcoding).
      - -j${KOPYPARTY_WORKERS:-1}
      # KD fork: in-memory directory cache — re-walk the tree this often (sec)
      # to pick up rarely-added files; 0 disables. First warm runs at startup,
      # so the first browse after boot is already served from RAM. A container
      # restart also forces an immediate re-warm.
      - --kd-dircache-secs=${KOPYPARTY_DIRCACHE_SECS:-86400}
      # KD fork: global download bandwidth cap in MB/s, shared across ALL
      # visitors (one token bucket). Protects the home uplink. 0 disables.
      # 0.061 MB/s ≈ 62.5 KB/s ≈ 500 kbps (kilobits/sec).
      - --kd-dl-limit=${KOPYPARTY_DL_LIMIT:-0.061}
      # KD fork: optional Google-auth gate. Set KOPYPARTY_AUTH_SECRET (shared
      # HMAC secret with the kunaldawn.com login service) to ENABLE; leave empty
      # to keep the archive public. Unauthenticated users are 302'd to
      # KOPYPARTY_AUTH_LOGIN_URL with the original URL in the 'redirect' param.
      - --kd-auth-secret=${KOPYPARTY_AUTH_SECRET:-}
      - --kd-auth-login-url=${KOPYPARTY_AUTH_LOGIN_URL:-}
      - --kd-auth-cookie=${KOPYPARTY_AUTH_COOKIE:-kd_session}
      - --kd-auth-return-param=${KOPYPARTY_AUTH_RETURN_PARAM:-redirect}
      - --kd-auth-iss=${KOPYPARTY_AUTH_ISS:-}
      - --kd-auth-aud=${KOPYPARTY_AUTH_AUD:-}
      - -i
      - 0.0.0.0
      - -p
      - "3923"
      - -v
      - /data::r

volumes:
  kopyparty_cache:
