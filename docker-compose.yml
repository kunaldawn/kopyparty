services:
  kopyparty:
    build: .
    container_name: kopyparty
    restart: unless-stopped
    ports:
      - "${KOPYPARTY_PORT:-8282}:3923"
    volumes:
      - ${KOPYPARTY_DATA_DIR:-./srv}:/data:ro
    mem_limit: ${KOPYPARTY_MEM_LIMIT:-2g}
    memswap_limit: ${KOPYPARTY_MEM_LIMIT:-2g}
    environment:
      - TZ=${TZ:-UTC}
    command:
      - --no-crt
      - --no-thumb
      - --grid
      - --kd-arch=${KOPYPARTY_ARCH_TYPE:-Data}
      - -i
      - 0.0.0.0
      - -p
      - "3923"
      - -v
      - /data::r
